<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<canvas id="grass-canvas"></canvas>

<script>
(function () {
  const canvas = document.getElementById('grass-canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;

  // ---------- 草配置（保持不变） ----------
  const BLADE_COUNT_BASE = 380;
  const BLADE_MIN_HEIGHT = 0.06;
  const BLADE_MAX_HEIGHT = 0.18;
  const BLADE_WIDTH_MIN = 2.0;
  const BLADE_WIDTH_MAX = 4.5;
  const SWAY_AMPLITUDE = 7;
  const SWAY_SPEED = 0.00055;
  const MOUSE_RADIUS = 130;
  const MOUSE_PUSH = 75;
  const SPRING = 0.025;
  const DAMPING = 0.91;
  const WIND_DRIFT = 0.15;

  // ---------- 涟漪配置（改为纯白 + 通透层次） ----------
  const RIPPLE_LIFE = 1900;          // 生命周期
  const RIPPLE_START_RADIUS = 2;
  const RIPPLE_MAX_RADIUS_MIN = 55;
  const RIPPLE_MAX_RADIUS_MAX = 120;
  const RIPPLE_SPAWN_DIST = 14;
  const RIPPLE_SPAWN_INTERVAL = 26;

  // ---------- 鼠标 ----------
  const mouse = { x: -9999, y: -9999, active: false };

  // ---------- 涟漪数据 ----------
  const ripples = [];
  let lastRippleX = -9999;
  let lastRippleY = -9999;
  let lastRippleTime = 0;

  function spawnRipple(x, y, now) {
    ripples.push({
      x, y,
      birth: now,
      life: RIPPLE_LIFE,
      maxRadius: RIPPLE_MAX_RADIUS_MIN +
                 Math.random() * (RIPPLE_MAX_RADIUS_MAX - RIPPLE_MAX_RADIUS_MIN),
      startRadius: RIPPLE_START_RADIUS,
      // 每个涟漪的初始旋转角，让波纹不完全是标准同心圆，略有手工感
      angleOffset: Math.random() * Math.PI * 2
    });
  }

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;

    const now = performance.now();
    const dx = e.clientX - lastRippleX;
    const dy = e.clientY - lastRippleY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > RIPPLE_SPAWN_DIST && now - lastRippleTime > RIPPLE_SPAWN_INTERVAL) {
      spawnRipple(e.clientX, e.clientY, now);
      lastRippleX = e.clientX;
      lastRippleY = e.clientY;
      lastRippleTime = now;
    }
  });

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
  });

  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) {
      mouse.x = t.clientX;
      mouse.y = t.clientY;
      mouse.active = true;

      const now = performance.now();
      const dx = t.clientX - lastRippleX;
      const dy = t.clientY - lastRippleY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > RIPPLE_SPAWN_DIST && now - lastRippleTime > RIPPLE_SPAWN_INTERVAL) {
        spawnRipple(t.clientX, t.clientY, now);
        lastRippleX = t.clientX;
        lastRippleY = t.clientY;
        lastRippleTime = now;
      }
    }
  }, { passive: true });

  window.addEventListener('touchend', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
  });

  // ---------- 草叶（保持不变） ----------
  const blades = [];

  function randomBetween(a, b) {
    return a + Math.random() * (b - a);
  }

  function buildBlades() {
    blades.length = 0;
    const count = Math.floor(BLADE_COUNT_BASE * Math.max(0.6, W / 1400));

    for (let i = 0; i < count; i++) {
      const baseX = Math.random() * W;
      const heightRatio = randomBetween(BLADE_MIN_HEIGHT, BLADE_MAX_HEIGHT);
      const height = H * heightRatio;

      blades.push({
        baseX,
        baseY: H + 6,
        height,
        baseWidth: randomBetween(BLADE_WIDTH_MIN, BLADE_WIDTH_MAX),
        bend: randomBetween(-14, 14),
        phase: Math.random() * Math.PI * 2,
        speedJitter: randomBetween(0.6, 1.4),
        alpha: randomBetween(0.22, 0.44),
        offset: 0,
        velocity: 0,
        targetOffset: 0
      });
    }
  }

  // ---------- 尺寸 ----------
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    buildBlades();
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 涟漪绘制：纯白 + 三层通透圆环 ----------
  function drawRipples(now) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      const t = (now - r.birth) / r.life;
      if (t >= 1) {
        ripples.splice(i, 1);
        continue;
      }

      // 半径扩散：先快后慢
      const ease = 1 - Math.pow(1 - t, 2.2);
      const radius = r.startRadius + (r.maxRadius - r.startRadius) * ease;

      // 主环透明度：二次衰减
      const fade = (1 - t) * (1 - t);

      // ---- 第一层：外环，最亮、最清晰 ----
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.5 * fade) + ')';
      ctx.lineWidth = 1.1;
      ctx.stroke();

      // ---- 第二层：中环，略微滞后，透明度更低 ----
      const midT = Math.max(0, t - 0.09);
      if (midT < 1) {
        const midEase = 1 - Math.pow(1 - midT, 2.2);
        const midR = r.startRadius + (r.maxRadius * 0.68 - r.startRadius) * midEase;
        const midFade = (1 - midT) * (1 - midT);
        if (midR > 0.5) {
          ctx.beginPath();
          ctx.arc(r.x, r.y, midR, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.28 * midFade) + ')';
          ctx.lineWidth = 0.9;
          ctx.stroke();
        }
      }

      // ---- 第三层：内环，最淡最细，营造水波的柔润感 ----
      const inT = Math.max(0, t - 0.18);
      if (inT < 1) {
        const inEase = 1 - Math.pow(1 - inT, 2.2);
        const inR = r.startRadius + (r.maxRadius * 0.42 - r.startRadius) * inEase;
        const inFade = (1 - inT) * (1 - inT);
        if (inR > 0.5) {
          ctx.beginPath();
          ctx.arc(r.x, r.y, inR, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.15 * inFade) + ')';
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }
  }

  // ---------- 主循环 ----------
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(now - lastTime, 32);
    lastTime = now;

    // 1) 纯黑背景
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // 2) 白色涟漪
    drawRipples(now);

    // 3) 草丛（原有逻辑，完全未改）
    const globalSway = Math.sin(now * SWAY_SPEED) * WIND_DRIFT;

    for (const b of blades) {
      const sway =
        Math.sin(now * SWAY_SPEED * b.speedJitter + b.phase) * SWAY_AMPLITUDE;

      let push = 0;
      if (mouse.active) {
        const tipX = b.baseX + sway + globalSway + b.bend;
        const tipY = b.baseY - b.height;

        const dx = tipX - mouse.x;
        const dy = tipY - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < MOUSE_RADIUS && dist > 0.001) {
          const force = (1 - dist / MOUSE_RADIUS) * MOUSE_PUSH;
          const dir = dx >= 0 ? 1 : -1;
          push = dir * force;
        }
      }

      b.targetOffset = push;

      const force = (b.targetOffset - b.offset) * SPRING;
      b.velocity += force;
      b.velocity *= DAMPING;
      b.offset += b.velocity;

      const tipX = b.baseX + sway + globalSway + b.bend + b.offset;
      const tipY = b.baseY - b.height;

      const halfW = b.baseWidth / 2;
      const leftBaseX = b.baseX - halfW;
      const rightBaseX = b.baseX + halfW;

      const ctrlY = b.baseY - b.height * 0.55;
      const leftCtrlX = leftBaseX + (tipX - leftBaseX) * 0.35 - halfW * 0.9;
      const rightCtrlX = rightBaseX + (tipX - rightBaseX) * 0.35 + halfW * 0.9;

      ctx.beginPath();
      ctx.moveTo(leftBaseX, b.baseY);
      ctx.quadraticCurveTo(leftCtrlX, ctrlY, tipX, tipY);
      ctx.quadraticCurveTo(rightCtrlX, ctrlY, rightBaseX, b.baseY);
      ctx.closePath();

      ctx.fillStyle = 'rgba(255, 255, 255, ' + b.alpha + ')';
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
