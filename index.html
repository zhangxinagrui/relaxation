<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<canvas id="grass-canvas"></canvas>

<script>
(function () {
  const canvas = document.getElementById('grass-canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;

  // ---------- 草配置（保持不变） ----------
  const BLADE_COUNT_BASE = 380;
  const BLADE_MIN_HEIGHT = 0.06;
  const BLADE_MAX_HEIGHT = 0.18;
  const BLADE_WIDTH_MIN = 2.0;
  const BLADE_WIDTH_MAX = 4.5;
  const SWAY_AMPLITUDE = 7;
  const SWAY_SPEED = 0.00055;
  const MOUSE_RADIUS = 130;
  const MOUSE_PUSH = 75;
  const SPRING = 0.025;
  const DAMPING = 0.91;
  const WIND_DRIFT = 0.15;

  // ---------- 烟雾配置（保持不变） ----------
  const SMOKE_LIFE_MIN = 900;
  const SMOKE_LIFE_MAX = 1700;
  const SMOKE_STEP = 2;
  const MAX_STEPS_PER_MOVE = 240;
  const MAX_SMOKE = 2200;

  // ---------- 萤火虫配置 ----------
  const FIREFLY_COUNT = 26;
  const FIREFLY_ATTRACT_RADIUS = 300;
  const FIREFLY_ATTRACT_PROB = 0.06;
  const FIREFLY_UP_DAMP = 0.45;
  const FIREFLY_TURN_EASE = 0.025;  // 实际朝向追目标方向的平滑系数
  const FIREFLY_DRIFT = 0.03;       // 目标方向自然漂移幅度

  // ---------- 鼠标 ----------
  const mouse = { x: -9999, y: -9999, active: false };

  // ---------- 烟雾 ----------
  const smoke = [];
  let lastX = -9999;
  let lastY = -9999;

  const SPRITE_SIZE = 128;
  const smokeSprite = document.createElement('canvas');
  smokeSprite.width = SPRITE_SIZE;
  smokeSprite.height = SPRITE_SIZE;
  (function makeSprite() {
    const sctx = smokeSprite.getContext('2d');
    const g = sctx.createRadialGradient(
      SPRITE_SIZE / 2, SPRITE_SIZE / 2, 0,
      SPRITE_SIZE / 2, SPRITE_SIZE / 2, SPRITE_SIZE / 2
    );
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
    g.addColorStop(0.7, 'rgba(255,255,255,0.16)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, SPRITE_SIZE, SPRITE_SIZE);
  })();

  function spawnSmoke(x, y) {
    if (smoke.length >= MAX_SMOKE) return;

    const now = performance.now();
    const spread = 7;
    const ox = (Math.random() - 0.5) * spread;
    const oy = (Math.random() - 0.5) * spread;

    smoke.push({
      x: x + ox,
      y: y + oy,
      r0: 6 + Math.random() * 9,
      r1: 24 + Math.random() * 26,
      life: SMOKE_LIFE_MIN + Math.random() * (SMOKE_LIFE_MAX - SMOKE_LIFE_MIN),
      birth: now,
      alpha: 0.06 + Math.random() * 0.06
    });
  }

  function handleMove(x, y) {
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;

    if (lastX < -9000) {
      lastX = x;
      lastY = y;
      return;
    }

    const dx = x - lastX;
    const dy = y - lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0.5) {
      const steps = Math.min(
        MAX_STEPS_PER_MOVE,
        Math.max(1, Math.ceil(dist / SMOKE_STEP))
      );

      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        spawnSmoke(lastX + dx * t, lastY + dy * t);
      }
    }

    lastX = x;
    lastY = y;
  }

  window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
    lastX = -9999;
    lastY = -9999;
  });

  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) handleMove(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('touchend', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
    lastX = -9999;
    lastY = -9999;
  });

  // ---------- 萤火虫 ----------
  const fireflies = [];

  const FF_SPRITE_SIZE = 64;
  const fireflySprite = document.createElement('canvas');
  fireflySprite.width = FF_SPRITE_SIZE;
  fireflySprite.height = FF_SPRITE_SIZE;
  (function makeFireflySprite() {
    const c = fireflySprite.getContext('2d');
    const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.12, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.3)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, 64, 64);
  })();

  function buildFireflies() {
    fireflies.length = 0;
    for (let i = 0; i < FIREFLY_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      fireflies.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.92,
        speed: 0.25 + Math.random() * 0.35,
        size: 1.2 + Math.random() * 1.5,
        wanderAngle: angle,
        targetAngle: angle,
        blinkSpeed: 0.0008 + Math.random() * 0.0015,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  // 角度插值：走最短弧，避免从 -π 到 π 时绕一大圈
  function angleLerp(current, target, t) {
    let diff = target - current;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    return current + diff * t;
  }

  function updateFireflies(now, dt) {
    const dtf = Math.min(dt / 16, 2);

    for (const f of fireflies) {
      const heightRatio = Math.min(1, Math.max(0, (H - f.y) / H));
      const upFactor = 1 - heightRatio * FIREFLY_UP_DAMP;

      // 1) 目标方向自然小幅漂移，越靠近顶部向上漂移越容易被抑制
      let drift = (Math.random() - 0.5) * FIREFLY_DRIFT * dtf;
      const nextTarget = f.targetAngle + drift;
      const wouldGoUp = Math.sin(nextTarget) < 0;
      if (wouldGoUp && Math.random() > upFactor) {
        drift = 0;
      }
      f.targetAngle += drift;

      // 2) 鼠标靠近：按概率把目标方向设成鼠标方向（带一点随机偏移）
      if (mouse.active) {
        const dx = mouse.x - f.x;
        const dy = mouse.y - f.y;
        const distSq = dx * dx + dy * dy;
        const R = FIREFLY_ATTRACT_RADIUS;

        if (distSq < R * R && distSq > 4) {
          const dist = Math.sqrt(distSq);
          const prob = (1 - dist / R) * FIREFLY_ATTRACT_PROB * dtf;

          if (Math.random() < prob) {
            // ±0.5 弧度随机偏移，避免所有萤火虫都精确对准鼠标
            f.targetAngle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.0;
          }
        }
      }

      // 3) 边界：目标方向转向屏幕中心，而不是直接改实际朝向
      const margin = 12;
      if (f.x < margin || f.x > W - margin || f.y < margin || f.y > H - margin) {
        f.targetAngle = Math.atan2(H / 2 - f.y, W / 2 - f.x);
        f.x = Math.max(margin, Math.min(W - margin, f.x));
        f.y = Math.max(margin, Math.min(H - margin, f.y));
      }

      // 4) 实际朝向平滑追向目标方向
      f.wanderAngle = angleLerp(f.wanderAngle, f.targetAngle, FIREFLY_TURN_EASE * dtf);

      // 5) 沿实际朝向移动
      f.x += Math.cos(f.wanderAngle) * f.speed * dtf;
      f.y += Math.sin(f.wanderAngle) * f.speed * dtf;
    }
  }

  function drawFireflies(now) {
    for (const f of fireflies) {
      const blink = 0.25 + 0.75 * (Math.sin(now * f.blinkSpeed + f.phase) * 0.5 + 0.5);
      const glowSize = f.size * 10;

      ctx.globalAlpha = blink * 0.8;
      ctx.drawImage(
        fireflySprite,
        f.x - glowSize / 2,
        f.y - glowSize / 2,
        glowSize,
        glowSize
      );
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 草叶（保持不变） ----------
  const blades = [];

  function randomBetween(a, b) {
    return a + Math.random() * (b - a);
  }

  function buildBlades() {
    blades.length = 0;
    const count = Math.floor(BLADE_COUNT_BASE * Math.max(0.6, W / 1400));

    for (let i = 0; i < count; i++) {
      const baseX = Math.random() * W;
      const heightRatio = randomBetween(BLADE_MIN_HEIGHT, BLADE_MAX_HEIGHT);
      const height = H * heightRatio;

      blades.push({
        baseX,
        baseY: H + 6,
        height,
        baseWidth: randomBetween(BLADE_WIDTH_MIN, BLADE_WIDTH_MAX),
        bend: randomBetween(-14, 14),
        phase: Math.random() * Math.PI * 2,
        speedJitter: randomBetween(0.6, 1.4),
        alpha: randomBetween(0.22, 0.44),
        offset: 0,
        velocity: 0,
        targetOffset: 0
      });
    }
  }

  // ---------- 尺寸 ----------
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    buildBlades();
    if (fireflies.length === 0) buildFireflies();
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 烟雾绘制（保持不变） ----------
  function drawSmoke(now) {
    for (let i = smoke.length - 1; i >= 0; i--) {
      const p = smoke[i];
      const age = (now - p.birth) / p.life;

      if (age >= 1) {
        smoke.splice(i, 1);
        continue;
      }

      const r = p.r0 + (p.r1 - p.r0) * Math.pow(age, 0.7);

      const fadeIn = Math.min(1, age / 0.12);
      const fadeOut = Math.pow(1 - age, 1.9);
      const alpha = p.alpha * fadeIn * fadeOut;

      if (alpha < 0.003) continue;

      ctx.globalAlpha = alpha;
      ctx.drawImage(smokeSprite, p.x - r, p.y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 主循环 ----------
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(now - lastTime, 32);
    lastTime = now;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    drawSmoke(now);

    updateFireflies(now, dt);
    drawFireflies(now);

    // 草丛（原有逻辑，完全未改）
    const globalSway = Math.sin(now * SWAY_SPEED) * WIND_DRIFT;

    for (const b of blades) {
      const sway =
        Math.sin(now * SWAY_SPEED * b.speedJitter + b.phase) * SWAY_AMPLITUDE;

      let push = 0;
      if (mouse.active) {
        const tipX = b.baseX + sway + globalSway + b.bend;
        const tipY = b.baseY - b.height;

        const dx = tipX - mouse.x;
        const dy = tipY - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < MOUSE_RADIUS && dist > 0.001) {
          const force = (1 - dist / MOUSE_RADIUS) * MOUSE_PUSH;
          const dir = dx >= 0 ? 1 : -1;
          push = dir * force;
        }
      }

      b.targetOffset = push;

      const force = (b.targetOffset - b.offset) * SPRING;
      b.velocity += force;
      b.velocity *= DAMPING;
      b.offset += b.velocity;

      const tipX = b.baseX + sway + globalSway + b.bend + b.offset;
      const tipY = b.baseY - b.height;

      const halfW = b.baseWidth / 2;
      const leftBaseX = b.baseX - halfW;
      const rightBaseX = b.baseX + halfW;

      const ctrlY = b.baseY - b.height * 0.55;
      const leftCtrlX = leftBaseX + (tipX - leftBaseX) * 0.35 - halfW * 0.9;
      const rightCtrlX = rightBaseX + (tipX - rightBaseX) * 0.35 + halfW * 0.9;

      ctx.beginPath();
      ctx.moveTo(leftBaseX, b.baseY);
      ctx.quadraticCurveTo(leftCtrlX, ctrlY, tipX, tipY);
      ctx.quadraticCurveTo(rightCtrlX, ctrlY, rightBaseX, b.baseY);
      ctx.closePath();

      ctx.fillStyle = 'rgba(255, 255, 255, ' + b.alpha + ')';
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
