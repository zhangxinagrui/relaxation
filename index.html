<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<canvas id="grass-canvas"></canvas>

<script>
(function () {
  const canvas = document.getElementById('grass-canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;

  // ---------- 草配置（保持不变） ----------
  const BLADE_COUNT_BASE = 380;
  const BLADE_MIN_HEIGHT = 0.06;
  const BLADE_MAX_HEIGHT = 0.18;
  const BLADE_WIDTH_MIN = 2.0;
  const BLADE_WIDTH_MAX = 4.5;
  const SWAY_AMPLITUDE = 7;
  const SWAY_SPEED = 0.00055;
  const MOUSE_RADIUS = 130;
  const MOUSE_PUSH = 75;
  const SPRING = 0.025;
  const DAMPING = 0.91;
  const WIND_DRIFT = 0.15;

  // ---------- 水纹配置 ----------
  const WATER_LIFE = 1500;       // 水纹生命期
  const SPAWN_DIST = 5;          // 每移动多少像素生成一个水纹采样点
  const MAX_WATER_POINTS = 260;  // 采样点上限，防止极端情况堆积
  const ARC_COUNT = 5;           // 每个采样点的弧线数量

  // ---------- 鼠标 ----------
  const mouse = { x: -9999, y: -9999, active: false };

  // ---------- 水纹采样点 ----------
  const waterPoints = [];
  let lastWaterX = -9999;
  let lastWaterY = -9999;

  function pushWaterPoint(x, y, now, vx, vy, speed) {
    if (waterPoints.length >= MAX_WATER_POINTS) return;
    waterPoints.push({
      x, y, time: now,
      vx, vy, speed,
      // 每条弧线的随机扰动，避免所有弧线完全规整
      jitter: Math.random() * 0.6 + 0.7
    });
  }

  function handleMove(x, y) {
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;

    const now = performance.now();

    if (lastWaterX < -9000) {
      lastWaterX = x;
      lastWaterY = y;
      return;
    }

    const dx = x - lastWaterX;
    const dy = y - lastWaterY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0.5) {
      const vx = dx / dist;
      const vy = dy / dist;
      const speed = Math.min(dist / 8, 3);

      // 在两点之间插值，保证快速移动时尾迹也连续
      const steps = Math.max(1, Math.ceil(dist / SPAWN_DIST));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        pushWaterPoint(
          lastWaterX + dx * t,
          lastWaterY + dy * t,
          now, vx, vy, speed
        );
      }
    }

    lastWaterX = x;
    lastWaterY = y;
  }

  window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
    lastWaterX = -9999;
    lastWaterY = -9999;
  });

  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) handleMove(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('touchend', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
    lastWaterX = -9999;
    lastWaterY = -9999;
  });

  // ---------- 草叶（保持不变） ----------
  const blades = [];

  function randomBetween(a, b) {
    return a + Math.random() * (b - a);
  }

  function buildBlades() {
    blades.length = 0;
    const count = Math.floor(BLADE_COUNT_BASE * Math.max(0.6, W / 1400));

    for (let i = 0; i < count; i++) {
      const baseX = Math.random() * W;
      const heightRatio = randomBetween(BLADE_MIN_HEIGHT, BLADE_MAX_HEIGHT);
      const height = H * heightRatio;

      blades.push({
        baseX,
        baseY: H + 6,
        height,
        baseWidth: randomBetween(BLADE_WIDTH_MIN, BLADE_WIDTH_MAX),
        bend: randomBetween(-14, 14),
        phase: Math.random() * Math.PI * 2,
        speedJitter: randomBetween(0.6, 1.4),
        alpha: randomBetween(0.22, 0.44),
        offset: 0,
        velocity: 0,
        targetOffset: 0
      });
    }
  }

  // ---------- 尺寸 ----------
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    buildBlades();
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 水流尾迹绘制 ----------
  function drawWater(now) {
    for (let i = waterPoints.length - 1; i >= 0; i--) {
      const p = waterPoints[i];
      const age = (now - p.time) / WATER_LIFE;
      if (age >= 1) {
        waterPoints.splice(i, 1);
        continue;
      }

      // 透明度：二次衰减，尾段柔和融入黑色
      const fade = Math.pow(1 - age, 2);
      // 扩散范围：随时间变大，速度快的划得更开
      const spread = 5 + age * (55 + p.speed * 12);
      // 垂直于运动方向的角度
      const perpAngle = Math.atan2(p.vx, -p.vy);

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(perpAngle);

      // 一组弧形水纹，中间长、两侧短，像被划开的扇形
      for (let k = 0; k < ARC_COUNT; k++) {
        const frac = k / (ARC_COUNT - 1);       // 0 → 1
        const t = frac - 0.5;                   // -0.5 → 0.5
        const len = spread * (1 - Math.abs(t) * 1.5) * p.jitter;
        if (len < 0.6) continue;

        const yOff = t * spread * 0.85;
        // 透明度：中心弧线亮，两侧弧线淡
        const alpha = 0.34 * fade * (1 - Math.abs(t) * 0.85);
        if (alpha < 0.005) continue;

        // 弯曲：越靠近两侧弯曲越明显，且随年龄逐渐回直
        const curve = spread * 0.18 * (t >= 0 ? 1 : -1) * (1 - age) * p.jitter;

        ctx.beginPath();
        ctx.moveTo(-len, yOff);
        ctx.quadraticCurveTo(0, yOff + curve, len, yOff);
        ctx.strokeStyle = 'rgba(255, 255, 255, ' + alpha + ')';
        ctx.lineWidth = 0.8;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      ctx.restore();
    }

    // 鼠标当前位置的柔和光晕：像水面被指尖压出的高光
    if (mouse.active) {
      const glowR = 55;
      const grad = ctx.createRadialGradient(
        mouse.x, mouse.y, 0,
        mouse.x, mouse.y, glowR
      );
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.055)');
      grad.addColorStop(0.55, 'rgba(255, 255, 255, 0.02)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, glowR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- 主循环 ----------
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(now - lastTime, 32);
    lastTime = now;

    // 1) 纯黑背景
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // 2) 水流尾迹
    drawWater(now);

    // 3) 草丛（原有逻辑，完全未改）
    const globalSway = Math.sin(now * SWAY_SPEED) * WIND_DRIFT;

    for (const b of blades) {
      const sway =
        Math.sin(now * SWAY_SPEED * b.speedJitter + b.phase) * SWAY_AMPLITUDE;

      let push = 0;
      if (mouse.active) {
        const tipX = b.baseX + sway + globalSway + b.bend;
        const tipY = b.baseY - b.height;

        const dx = tipX - mouse.x;
        const dy = tipY - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < MOUSE_RADIUS && dist > 0.001) {
          const force = (1 - dist / MOUSE_RADIUS) * MOUSE_PUSH;
          const dir = dx >= 0 ? 1 : -1;
          push = dir * force;
        }
      }

      b.targetOffset = push;

      const force = (b.targetOffset - b.offset) * SPRING;
      b.velocity += force;
      b.velocity *= DAMPING;
      b.offset += b.velocity;

      const tipX = b.baseX + sway + globalSway + b.bend + b.offset;
      const tipY = b.baseY - b.height;

      const halfW = b.baseWidth / 2;
      const leftBaseX = b.baseX - halfW;
      const rightBaseX = b.baseX + halfW;

      const ctrlY = b.baseY - b.height * 0.55;
      const leftCtrlX = leftBaseX + (tipX - leftBaseX) * 0.35 - halfW * 0.9;
      const rightCtrlX = rightBaseX + (tipX - rightBaseX) * 0.35 + halfW * 0.9;

      ctx.beginPath();
      ctx.moveTo(leftBaseX, b.baseY);
      ctx.quadraticCurveTo(leftCtrlX, ctrlY, tipX, tipY);
      ctx.quadraticCurveTo(rightCtrlX, ctrlY, rightBaseX, b.baseY);
      ctx.closePath();

      ctx.fillStyle = 'rgba(255, 255, 255, ' + b.alpha + ')';
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
