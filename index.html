<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<canvas id="grass-canvas"></canvas>

<script>
(function () {
  const canvas = document.getElementById('grass-canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;

  // ---------- 配置 ----------
  const BLADE_COUNT_BASE = 380;      // 基准数量，更密
  const BLADE_MIN_HEIGHT = 0.06;     // 更矮
  const BLADE_MAX_HEIGHT = 0.18;
  const BLADE_WIDTH_MIN = 2.0;       // 根部宽度，更粗
  const BLADE_WIDTH_MAX = 4.5;
  const SWAY_AMPLITUDE = 7;          // 自然摇曳幅度
  const SWAY_SPEED = 0.00055;
  const MOUSE_RADIUS = 130;          // 鼠标影响半径
  const MOUSE_PUSH = 75;             // 最大推开距离
  const SPRING = 0.025;              // 弹簧刚度，越小恢复越慢
  const DAMPING = 0.91;              // 阻尼，越接近 1 回弹越慢越柔
  const WIND_DRIFT = 0.15;           // 全局微风漂移

  // ---------- 鼠标 ----------
  const mouse = { x: -9999, y: -9999, active: false };
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('mouseleave', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
  });
  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) {
      mouse.x = t.clientX;
      mouse.y = t.clientY;
      mouse.active = true;
    }
  }, { passive: true });
  window.addEventListener('touchend', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
  });

  // ---------- 草叶 ----------
  const blades = [];

  function randomBetween(a, b) {
    return a + Math.random() * (b - a);
  }

  function buildBlades() {
    blades.length = 0;

    const count = Math.floor(BLADE_COUNT_BASE * Math.max(0.6, W / 1400));

    for (let i = 0; i < count; i++) {
      const baseX = Math.random() * W;
      const heightRatio = randomBetween(BLADE_MIN_HEIGHT, BLADE_MAX_HEIGHT);
      const height = H * heightRatio;

      blades.push({
        baseX,
        baseY: H + 6,                                // 根部略低出屏幕
        height,
        baseWidth: randomBetween(BLADE_WIDTH_MIN, BLADE_WIDTH_MAX),
        bend: randomBetween(-14, 14),                // 静态自然弯向
        phase: Math.random() * Math.PI * 2,
        speedJitter: randomBetween(0.6, 1.4),
        alpha: randomBetween(0.22, 0.44),            // 每根草透明度错落
        offset: 0,
        velocity: 0,
        targetOffset: 0
      });
    }
  }

  // ---------- 尺寸 ----------
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    buildBlades();
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 主循环 ----------
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(now - lastTime, 32);
    lastTime = now;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const globalSway = Math.sin(now * SWAY_SPEED) * WIND_DRIFT;

    for (const b of blades) {
      // 自然摇曳
      const sway =
        Math.sin(now * SWAY_SPEED * b.speedJitter + b.phase) * SWAY_AMPLITUDE;

      // 鼠标拨开
      let push = 0;
      if (mouse.active) {
        const tipX = b.baseX + sway + globalSway + b.bend;
        const tipY = b.baseY - b.height;

        const dx = tipX - mouse.x;
        const dy = tipY - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < MOUSE_RADIUS && dist > 0.001) {
          const force = (1 - dist / MOUSE_RADIUS) * MOUSE_PUSH;
          const dir = dx >= 0 ? 1 : -1;
          push = dir * force;
        }
      }

      b.targetOffset = push;

      // 弹簧 + 阻尼：慢速平滑恢复
      const force = (b.targetOffset - b.offset) * SPRING;
      b.velocity += force;
      b.velocity *= DAMPING;
      b.offset += b.velocity;

      // ---------- 绘制：下粗上尖的填充草叶 ----------
      const tipX = b.baseX + sway + globalSway + b.bend + b.offset;
      const tipY = b.baseY - b.height;

      const halfW = b.baseWidth / 2;
      const leftBaseX = b.baseX - halfW;
      const rightBaseX = b.baseX + halfW;

      // 控制点放在 55% 高度处，左右略向外鼓，形成底部稍粗的弧度
      const ctrlY = b.baseY - b.height * 0.55;
      const leftCtrlX = leftBaseX + (tipX - leftBaseX) * 0.35 - halfW * 0.9;
      const rightCtrlX = rightBaseX + (tipX - rightBaseX) * 0.35 + halfW * 0.9;

      ctx.beginPath();
      ctx.moveTo(leftBaseX, b.baseY);
      ctx.quadraticCurveTo(leftCtrlX, ctrlY, tipX, tipY);
      ctx.quadraticCurveTo(rightCtrlX, ctrlY, rightBaseX, b.baseY);
      ctx.closePath();

      ctx.fillStyle = 'rgba(255, 255, 255, ' + b.alpha + ')';
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
